<!DOCTYPE html>
<!--
  ====================================================================
   HOME SWEET HOME - HISTORY (página do histórico)
  ====================================================================
   Mostra uma tabela com os últimos acontecimentos da casa.
   É uma página só de HTML e CSS: não tem JavaScript.
   Os dados da tabela são fixos (escritos à mão no HTML).

   <!DOCTYPE html> diz ao browser que esta página é HTML5.
  ====================================================================
-->

<!-- Elemento raiz. lang="pt-PT" indica que a língua é português de Portugal. -->
<html lang="pt-PT">

<!-- <head>: informação sobre a página (não aparece no corpo). -->
<head>
  <!-- Codificação UTF-8: permite acentos e símbolos especiais. -->
  <meta charset="UTF-8">

  <!-- Ajusta a página à largura do ecrã em telemóveis. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Texto do separador (tab) do browser. -->
  <title>History</title>

  <!-- Font Awesome (ícones). Esta página não usa ícones, mas fica
       carregado para manter o mesmo cabeçalho do index.html. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- Bootstrap 5.3.3 (CSS): dá o aspeto à navbar.
       integrity / crossorigin: o browser confirma que o ficheiro não foi alterado. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!--
    <style>: CSS escrito diretamente nesta página (CSS "interno").
    Só se aplica a esta página. Formata a tabela do histórico.
    Nota: o Bootstrap tem as suas próprias classes para tabelas
    (class="table", "table-striped", Cap 2 slide 13), mas aqui o
    estilo foi feito à mão.
  -->
  <style>
    /* Regras para TODAS as <table> da página */
    table {
      font-family: arial, sans-serif;   /* letra Arial; se não existir, outra sem serifas */
      border-collapse: collapse;        /* junta as bordas das células numa só linha (sem espaços entre células) */
      width: 100%;                      /* a tabela ocupa toda a largura disponível */
    }

    /* Regras para as células: td (dados) e th (cabeçalho).
       A vírgula aplica a mesma regra aos dois. */
    td,
    th {
      text-align: left;   /* texto alinhado à esquerda (por defeito o th fica centrado) */
      padding: 8px;       /* espaço de 8 píxeis entre o texto e a borda da célula */
    }

    /* tr:nth-child(odd) seleciona as linhas ÍMPARES da tabela (1ª, 3ª, 5ª...)
       e pinta-as de cinzento claro. Assim as linhas ficam alternadas
       (efeito "zebra"), o que facilita a leitura.
       Como a linha de cabeçalho é a 1ª, também fica cinzenta. */
    tr:nth-child(odd) {
      background-color: #dddddd;
    }
  </style>


</head>

<!-- <body>: tudo o que aparece no ecrã. -->
<body>

  <!--
    BARRA DE NAVEGAÇÃO
    É igual à do index.html (ver os comentários de lá para cada classe).
    A diferença está nos links: aqui o "active" está no History,
    porque é a página onde estamos.
  -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <div class="row">
        <div class="col-sm"></div><a class="navbar-brand">Home Sweet Home</a>
      </div>
      <div class="col-sm"></div>
    </div>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <!-- Link para o Dashboard (página principal).
             Nota: o "(current)" escondido (visually-hidden) está a seguir
             ao Dashboard, mas nesta página a atual é o History. Para os
             leitores de ecrã ficar certo, devia estar a seguir ao History. -->
        <a class=" nav-link" href="index.html">Dashboard</a><span class="visually-hidden">(current)</span>
        <!-- Link para esta página. "active" marca-o como página atual (mais claro). -->
        <a class="nav-link active" href="history.html">History</a>
      </div>
    </div>
  </nav>

  <!-- Quebra de linha: espaço entre a navbar e a tabela.
       O <br> não tem tag de fecho (escrever </br> é inválido). -->
  <br>


    <!--
      ================================================================
       TABELA DO HISTÓRICO
      ================================================================
       <table> -> a tabela
       <tr>    -> uma linha (table row)
       <th>    -> célula de cabeçalho (table header): texto a negrito
       <td>    -> célula de dados (table data)
       Cada linha tem 3 células, uma por coluna:
       Category (o quê) | State (estado) | Last Changed (quando mudou)
    -->
    <table>

      <!-- Linha de cabeçalho: os títulos das colunas -->
      <tr>
        <th>Category</th>
        <th>State</th>
        <th>Last Changed</th>
      </tr>

      <!-- Luz da cozinha desligada às 23:40 de 16/09/2018 -->
      <tr>
        <td>Kitchen lights</td>
        <td>Off</td>
        <td>23:40 2018-09-16</td>
      </tr>

      <!-- Luz da cozinha ligada às 20:30 -->
      <tr>
        <td>Kitchen lights</td>
        <td>On</td>
        <td>20:30 2018-09-16</td>
      </tr>

      <!-- Pôr do sol às 20:35 -->
      <tr>
        <td>Weather</td>
        <td>Sunset</td>
        <td>20:35 2018-09-16</td>
      </tr>

      <!-- Campainha tocou às 19:30 -->
      <tr>
        <td>Bell</td>
        <td>Ring</td>
        <td>19:30 2018-09-16</td>
      </tr>

    </table>

</body>

</html>

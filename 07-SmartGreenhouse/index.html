<!DOCTYPE html>
<!--
  =====================================================================
   Ficha 7 - Estufa Inteligente
   index.html  →  DASHBOARD (interface da Figura 2)

   - Aspeto: Bootstrap 5 (navbar, grelha, cards, badges, botões).
   - Ícones: Font Awesome.
   - Comportamento: js/index.js (lê e escreve na Firebase).

   Esta página tem de ser servida por HTTP (Uniform Server ou Live
   Server). Aberta com duplo clique (file://) os módulos ES não
   funcionam e os dados nunca aparecem.
  =====================================================================
-->

<!-- lang="pt-PT": língua da página (ajuda leitores de ecrã e motores de busca). -->
<html lang="pt-PT">

<!-- ===================================================================
     <head>: informação SOBRE a página. Nada daqui aparece no ecrã,
     exceto o <title>, que aparece no separador do browser.
     =================================================================== -->
<head>
  <!-- Codificação dos caracteres: permite acentos e o símbolo °. -->
  <meta charset="UTF-8">

  <!-- Autor da página (não aparece no ecrã). -->
  <meta name="author" content="Flávio Duarte">

  <!-- Ajusta a página à largura do ecrã em telemóveis.
       Sem isto, o Bootstrap não é responsivo. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Texto do separador do browser. -->
  <title>Smart Greenhouse</title>

  <!-- Font Awesome 6.7.2: biblioteca de ícones, usada com <i class="fa-...">.
       Vem de um CDN, por isso não precisa de estar no projeto.
       É a mesma versão das Fichas 2 a 4. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- Bootstrap 5.3.3 (CSS): dá o aspeto à página.
       integrity: "impressão digital" do ficheiro; o browser confirma
       que não foi alterado. crossorigin="anonymous" é necessário para
       essa verificação funcionar com ficheiros de outro servidor. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<!-- ===================================================================
     <body>: tudo o que aparece no ecrã.
     bg-light: fundo cinzento-claro, como na Figura 2 (os cards
     brancos destacam-se do fundo).
     =================================================================== -->
<body class="bg-light">

  <!-- =================================================================
       BARRA DE NAVEGAÇÃO
       - navbar: transforma o <nav> numa barra do Bootstrap.
       - navbar-expand-lg: em ecrãs grandes mostra os links na barra.
       - navbar-dark: texto claro (para fundo escuro).
       - bg-dark: fundo quase preto.
       ================================================================= -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <!-- container: centra o conteúdo com margens laterais, alinhado com
         os cards mais abaixo (que também estão num container). -->
    <div class="container">

      <!-- navbar-brand: nome do site, à esquerda.
           fa-seedling: ícone do rebento (planta). me-1: pequena margem à direita. -->
      <a class="navbar-brand" href="index.html">
        <i class="fa-solid fa-seedling me-1"></i> Smart Greenhouse
      </a>

      <!-- Links da navbar. ms-auto (margin-start: auto) empurra-os para a
           direita, como o "Dashboard" da Figura 2. -->
      <div class="navbar-nav ms-auto">
        <!-- active + aria-current="page": indica que é a página atual. -->
        <a class="nav-link active" aria-current="page" href="index.html">Dashboard</a>
      </div>
    </div>
  </nav>

  <!-- =================================================================
       CONTEÚDO PRINCIPAL
       <main>: elemento semântico do HTML5 para o conteúdo principal.
       py-4: espaço em cima e em baixo.
       ================================================================= -->
  <main class="container py-4">

    <!-- ===============================================================
         SENSORES (Desafio B, ponto 2)
         Cada sensor num card com: ícone, nome, valor, unidade e hora.

         Grelha do Bootstrap:
         - row: uma linha da grelha (12 colunas).
         - g-3: espaço entre os cards.
         - col-md-4: em ecrãs médios ou maiores, cada card ocupa 4 de 12
           colunas (3 cards lado a lado). Em telemóveis ficam empilhados.

         Os valores começam em "--" e "Waiting for data…". O js/index.js
         substitui-os quando chegam dados. Para isso cada elemento a
         alterar tem um id único (ex.: temperature-value).
         =============================================================== -->
    <div class="row g-3">

      <!-- ---------- Card: Temperatura ---------- -->
      <div class="col-md-4">
        <!-- h-100: todos os cards ficam com a mesma altura. -->
        <div class="card h-100">
          <div class="card-body">
            <!-- Nome do sensor: texto pequeno (small) e cinzento (text-secondary).
                 fa-temperature-half: ícone do termómetro. -->
            <p class="text-secondary small mb-1">
              <i class="fa-solid fa-temperature-half me-1"></i> Temperature
            </p>
            <!-- Valor: grande (h3) e verde (text-success), como na Figura 2. -->
            <h3 class="text-success mb-1" id="temperature-value">-- °C</h3>
            <!-- Hora da última leitura. -->
            <p class="text-secondary small mb-0" id="temperature-time">Waiting for data…</p>
          </div>
        </div>
      </div>

      <!-- ---------- Card: Humidade ---------- -->
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <!-- fa-droplet: ícone da gota. -->
            <p class="text-secondary small mb-1">
              <i class="fa-solid fa-droplet me-1"></i> Humidity
            </p>
            <h3 class="text-success mb-1" id="humidity-value">-- %</h3>
            <p class="text-secondary small mb-0" id="humidity-time">Waiting for data…</p>
          </div>
        </div>
      </div>

      <!-- ---------- Card: Luminosidade ---------- -->
      <div class="col-md-4">
        <div class="card h-100">
          <div class="card-body">
            <!-- fa-sun: ícone do sol. -->
            <p class="text-secondary small mb-1">
              <i class="fa-solid fa-sun me-1"></i> Luminosity
            </p>
            <!-- Na Figura 2 o valor da luminosidade é preto, sem text-success. -->
            <h3 class="mb-1" id="luminosity-value">-- lux</h3>
            <p class="text-secondary small mb-0" id="luminosity-time">Waiting for data…</p>
          </div>
        </div>
      </div>

    </div>

    <!-- ===============================================================
         ATUADORES (Desafio B, ponto 3)
         Um card com cabeçalho "Actuators" e uma lista com uma linha por
         atuador: ícone, nome, badge ON/OFF, hora e botão.
         mt-1: pequena margem em relação à linha dos sensores.
         =============================================================== -->
    <div class="row g-3 mt-1">

      <!-- col-md-4: o card ocupa a mesma largura de um card de sensor. -->
      <div class="col-md-4">
        <div class="card">

          <!-- card-header: faixa de título do card.
               text-center: centrado. fw-semibold: letra mais grossa. -->
          <div class="card-header text-center fw-semibold">Actuators</div>

          <!-- list-group-flush: lista sem bordas exteriores, encaixada no card. -->
          <ul class="list-group list-group-flush">

            <!-- ---------- Ventoinha ----------
                 d-flex + justify-content-between: o texto fica à esquerda e o
                 botão à direita. align-items-center: centrados na vertical. -->
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <div>
                <!-- fa-fan: ícone da ventoinha. -->
                <i class="fa-solid fa-fan me-1"></i>
                <span class="fw-semibold">Fan</span>
                <!-- Badge ON/OFF. Começa cinzento (OFF); o js troca a cor
                     para verde (text-bg-success) quando está ON. -->
                <span class="badge ms-1 text-bg-secondary" id="fan-badge">OFF</span>
                <!-- Hora da última mudança de estado. -->
                <div class="text-secondary small" id="fan-time">Waiting for data…</div>
              </div>
              <!-- Botão de ligar/desligar.
                   btn-outline-secondary: botão só com contorno cinzento.
                   btn-sm: pequeno.
                   disabled: começa desativado até se saber o estado real;
                   o js ativa-o quando chegam os dados da Firebase. -->
              <button type="button" class="btn btn-outline-secondary btn-sm" id="fan-btn" disabled>Turn on</button>
            </li>

            <!-- ---------- Rega ---------- -->
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <div>
                <!-- fa-faucet-drip: ícone da torneira a pingar. -->
                <i class="fa-solid fa-faucet-drip me-1"></i>
                <span class="fw-semibold">Irrigation</span>
                <span class="badge ms-1 text-bg-secondary" id="irrigation-badge">OFF</span>
                <div class="text-secondary small" id="irrigation-time">Waiting for data…</div>
              </div>
              <button type="button" class="btn btn-outline-secondary btn-sm" id="irrigation-btn" disabled>Turn on</button>
            </li>

          </ul>
        </div>
      </div>
    </div>

  </main>

  <!-- =================================================================
       SCRIPTS (no fim do body, como pede a ficha)
       type="module": permite usar import/export (ES Modules).
       Ficam no fim para os elementos com id já existirem quando o
       index.js os procura com getElementById.
       ================================================================= -->
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/index.js"></script>
</body>

</html>
